name: dateclibro

services:
  # ========================================================
  # Servicio 1: Servidor Web Principal (PHP-FPM + Nginx)
  # ========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dateclibro-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dateclibro_network

  # ========================================================
  # Servicio 2: Base de Datos PostgreSQL
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: dateclibro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dateclibro}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Puerto externo configurable para no colisionar con otros PostgreSQL del host
      - "${DB_PORT_EXTERNAL:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-dateclibro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dateclibro_network

  # ========================================================
  # Servicio 3: Worker de Colas (Emails, Envíos, Custodia)
  # ========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dateclibro-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=180"]
    environment:
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - dateclibro_network

  # ========================================================
  # Servicio 4: Programador de Tareas (Cron / Schedulers)
  # ========================================================
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dateclibro-cron
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - dateclibro_network

# ========================================================
# Red y Volúmenes Persistentes Exclusivos de DatecLibro
# ========================================================
networks:
  dateclibro_network:
    driver: bridge

volumes:
  app_storage:
    name: dateclibro_storage_data
  db_data:
    name: dateclibro_postgres_data

